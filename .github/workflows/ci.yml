name: CI

# Runs only what a runner can honestly verify: no dataset download, model
# weights, GPU, browser, or Ollama. The README names the local checks that cover
# those boundaries.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch supersedes the run in flight on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Test the application against its declared runtime, including the
      # optional assistant contract. The suite stubs model inference and never
      # downloads weights, but detector and segmenter contract tests import
      # their real torch/transformers boundary.
      # Install PyTorch's official CPU wheel first. The default Linux wheel
      # would otherwise pull CUDA and Triton libraries that this runner cannot
      # use; requirements.txt then sees the declared torch constraint satisfied.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: pip install -r requirements.txt -r requirements-agent.txt ruff
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` is `tsc && vite build`, so this is the type-check and
      # the production build in one step.
      - run: npm run build

  documentation:
    name: documentation (relative links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only: every relative link and image path in the Markdown must
      # point at a file that exists. Catches the stale path a reviewer finds.
      - run: python scripts/check_links.py
