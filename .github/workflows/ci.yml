name: CI

# Runs only what a runner can honestly verify: no dataset download, model
# weights, GPU, browser, or Ollama. The README names the local checks that cover
# those boundaries.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch supersedes the run in flight on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Deliberately lightweight: the suite runs without torch, transformers,
      # or datasets. A fake embedder stands in for SigLIP and the
      # graceful-degradation paths are exercised instead. Agent contract tests
      # import the optional LangChain/LangGraph layer, so CI installs its small
      # dedicated manifest as well. This remains the set of packages the tests
      # import, not what the app needs to serve a request --
      # backend/requirements.txt remains the canonical runtime manifest.
      # tqdm is here because app.analyze imports it at module scope.
      - run: pip install fastapi httpx pydantic numpy pillow pytest ruff tqdm uvicorn -r requirements-agent.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` is `tsc && vite build`, so this is the type-check and
      # the production build in one step.
      - run: npm run build

  documentation:
    name: documentation (relative links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only: every relative link and image path in the Markdown must
      # point at a file that exists. Catches the stale path a reviewer finds.
      - run: python scripts/check_links.py
