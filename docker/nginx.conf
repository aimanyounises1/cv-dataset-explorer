# Serves the built SPA and proxies the API, so the browser sees one origin.
# That is also why the compose stack needs no CORS change: requests go to
# localhost:5173 and are forwarded from here, never cross-origin from the
# browser's point of view.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The largest chunk is ~366 kB of chart code; gzip is worth the CPU.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api and /media are the two prefixes frontend/vite.config.ts proxies in
    # dev. Keeping them identical here is what makes a URL that works under
    # `npx vite` work unchanged against this stack.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults to a 60 s read timeout, which is shorter than work the
        # API is documented to do: the assistant's per-lane bound is 240 s
        # (CVDE_AGENT_LANE_TIMEOUT) and POST /api/qa/run drives a whole sweep.
        # Under the default those return 504 from nginx while the backend is
        # still working — a timeout the app never sees and cannot report.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # POST /api/search/by-image sends a whole photo as the raw request
        # body. nginx's 1 MB default would reject an ordinary camera image.
        client_max_body_size 32m;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Images, thumbnails and QA artifacts are written once by ingest and
        # never edited in place, so the gallery can reuse them across reloads.
        expires 1h;
        add_header Cache-Control "public";
    }

    # Client-side routes (/compare, /eval, ...) are not files on disk. Only
    # this location falls back to index.html — a missing /api path still
    # returns the API's own 404 rather than a page of HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
